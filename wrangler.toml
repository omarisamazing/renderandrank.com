# Cloudflare Pages configuration for renderandrank.com
# Docs: https://developers.cloudflare.com/pages/functions/wrangler-configuration/
name = "renderandrank-com"
compatibility_date = "2024-11-01"

# Astro builds the static site to ./dist; Pages Functions live in ./functions
# and are deployed automatically alongside it.
pages_build_output_dir = "dist"

# Non-secret defaults. The contact form uses these when delivering leads.
# RESEND_API_KEY must be added as an ENCRYPTED secret in the Pages dashboard
# (or via `wrangler pages secret put RESEND_API_KEY`) — never commit it here.
[vars]
CONTACT_TO = "hello@renderandrank.com"
CONTACT_FROM = "Render and Rank <onboarding@resend.dev>"

# Cloudflare Workers AI — powers the on-site chat assistant (functions/api/chat.ts).
# The binding is exposed to Functions as `env.AI` (typed `Ai` in the Env
# interface). No API key or secret is required: Workers AI is billed to the
# Cloudflare account that owns the Pages project. When this binding is absent
# the chat endpoint fails closed with a JSON error.
# Docs: https://developers.cloudflare.com/workers-ai/configuration/bindings/
[ai]
binding = "AI"

# Cloudflare D1 (serverless SQLite) — stores every contact submission.
# Create it once with:  npx wrangler d1 create renderandrank_leads
# then paste the returned database_id below (and in the Pages dashboard binding).
[[d1_databases]]
binding = "DB"
database_name = "renderandrank_leads"
database_id = "879d5a9e-7792-41b8-b763-5cc7c298f14e"
migrations_dir = "migrations"

# Cloudflare KV for contact-form / chat rate limiting. The Functions read it
# as `env.RATE_LIMIT` (functions/api/chat.ts and functions/api/contact.ts).
# Create the namespaces once, then paste the returned ids below:
#   npx wrangler kv namespace create "RATE_LIMIT"
#   npx wrangler kv namespace create "RATE_LIMIT" --preview
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "5577e759bf2c4a43a3aa139b32e593ec"
preview_id = "7f9e7110cce34bcca4a2aea6298024d8"
